name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build apk --release

      # Nama file APK memuat id aplikasi + versi (instruksi user):
      # contoh: kasirquh-v3.6.15+29.apk
      - name: Beri nama APK (id aplikasi + versi)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APP_ID=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' android/app/build.gradle.kts | head -1)
          SHORT=$(echo "$APP_ID" | cut -d. -f2)
          SRC=build/app/outputs/flutter-apk/app-release.apk
          DST=build/app/outputs/flutter-apk/${SHORT}-v${VERSION}.apk
          mv "$SRC" "$DST"
          echo "APK_NAME=$(basename "$DST")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: kasirquh-app-release
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
